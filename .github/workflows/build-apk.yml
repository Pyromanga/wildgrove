name: Build Android APK

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: Nur bei Push/PR wenn die Commit-Message das Wort "App" enthält.
# workflow_dispatch erlaubt manuellen Start über die GitHub-UI (kein Commit nötig).
#
# GATING (Issue #3, 2026-10-11, harte Variante): build-android wartet jetzt auf
# test-logic UND integration-two-process — rote Tests = keine APK. Ein grünes
# APK-Artifact ist damit tatsächlich eine getestete APK. (Vorher liefen alle
# Jobs parallel und die Pipeline publizierte APKs unabhängig vom Testergebnis.)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"
  EXPORT_NAME: "WildGrove"

jobs:

  # ─── Gemeinsame Vorarbeit: Projektquelle auflösen ───────────────────────────
  # Logik lebt in scripts/ci/resolve_source.py (lokal testbar, siehe
  # scripts/ci/README.md): ZIP ist nur Quelle, wenn es im Trigger-Commit
  # geändert wurde (Claude-Chat-Workflow) oder bei manueller Auslösung;
  # sonst Repo-Root. FIX 2026-10-11: vorher wurde das ZIP bei bloßer
  # Existenz immer benutzt — Commits wurden dann gegen einen veralteten
  # ZIP-Stand getestet statt gegen das Repo.
  resolve-source:
    name: Resolve Project Source
    runs-on: ubuntu-22.04
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'App') ||
      contains(github.event.pull_request.title, 'App')
    outputs:
      project_path: ${{ steps.detect.outputs.project_path }}
      used_zip: ${{ steps.detect.outputs.used_zip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          # Volle History nötig für den "im Trigger-Commit geändert?"-Check
          # (git diff HEAD^ HEAD) im detect-Schritt.
          fetch-depth: 0

      - name: Detect source (zip vs. repo)
        id: detect
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve_source.py \
            --event "${{ github.event_name }}" \
            --output "$GITHUB_OUTPUT"

          USED_ZIP=$(grep '^used_zip=' "$GITHUB_OUTPUT" | cut -d= -f2)
          if [ "$USED_ZIP" = "true" ]; then
            echo "📦 Entpacke zip/game.zip als Projektquelle ..."
            rm -rf _project_from_zip && mkdir -p _project_from_zip
            unzip -q zip/game.zip -d _project_from_zip
            PROJECT_GODOT=$(find _project_from_zip -name project.godot -maxdepth 4 | head -1)
            if [ -z "$PROJECT_GODOT" ]; then
              echo "❌ Kein project.godot in game.zip gefunden!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PROJECT_GODOT")
            echo "✅ Projekt in ZIP gefunden: $PROJECT_DIR"
            echo "project_path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          else
            if [ ! -f project.godot ]; then
              echo "❌ Weder ZIP-Projekt noch Repo-Root-project.godot gefunden!"
              exit 1
            fi
            echo "project_path=." >> "$GITHUB_OUTPUT"
          fi

      # Den aufgelösten Projektstand als Artefakt zwischenspeichern damit
      # test- und build-Job nicht beide das ZIP entpacken müssen.
      - name: Upload resolved project
        uses: actions/upload-artifact@v4
        with:
          name: resolved-project
          path: |
            ${{ steps.detect.outputs.project_path }}
            !**/.git/
            !**/zip/
          retention-days: 1

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  test-logic:
    name: Run Unit Tests
    runs-on: ubuntu-22.04
    needs: resolve-source
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Download resolved project
        uses: actions/download-artifact@v4
        with:
          name: resolved-project
          path: project

      - name: Install GUT Addon
        run: |
          mkdir -p project/addons
          wget -q https://github.com/bitwes/Gut/archive/refs/tags/v9.6.0.zip -O gut.zip
          unzip -q gut.zip
          mv Gut-9.6.0/addons/gut project/addons/
          rm -rf gut.zip Gut-9.6.0

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Format check (gdformat)
        run: |
          pip install --quiet gdtoolkit
          find project -name "*.gd" | grep -v "addons/" | xargs gdformat --check || true

      - name: Force asset import
        run: |
          cd project
          godot --headless --editor --quit 2>&1 || true
          sleep 3

      - name: Run GUT tests
        run: |
          cd project
          godot --headless -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -gjunit_xml_file=res://results.xml \
            -gexit \
            2>&1 | tee gut-output.log

      - name: Run GUT integration tests (two-peer, ADR-025/026)
        run: |
          cd project
          set +e
          godot --headless -s res://addons/gut/gut_cmdln.gd \
            -gdir=res://tests/integration \
            -gjunit_xml_file=res://results-integration.xml \
            -gexit \
            2>&1 | tee gut-integration-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "GUT integration exit code: $EXIT_CODE"
          exit $EXIT_CODE

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'project/results.xml,project/results-integration.xml'

      - name: Add test log to job summary
        if: always()
        run: |
          TAIL_BYTES=200000
          {
            echo "## GUT Testergebnisse (Unit)"
            echo "_(zeigt max. die letzten ${TAIL_BYTES} Bytes — komplettes Log im Artifact 'gut-test-log')_"
            echo '```'
            tail -c "$TAIL_BYTES" project/gut-output.log
            echo '```'
            echo "## GUT Testergebnisse (Integration — Two-Peer, ADR-025/026)"
            echo '```'
            tail -c "$TAIL_BYTES" project/gut-integration-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-log
          path: |
            project/gut-output.log
            project/gut-integration-output.log
          retention-days: 14
          if-no-files-found: warn

  # ─── IT-03: echter Zwei-Prozess-Movement-Round-Trip ─────────────────────────
  # FIX 2026-10-11 (Issue #5): Bei Failure werden Host-/Client-Logs automatisch
  # als Kommentar in Issue #5 gepostet (gh api, permissions: issues: write) —
  # damit ist die Ursache ohne Login in den Job-Logs diagnosable.
  integration-two-process:
    name: IT-03 — Two-Process Movement Round Trip
    runs-on: ubuntu-22.04
    needs: resolve-source
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download resolved project
        uses: actions/download-artifact@v4
        with:
          name: resolved-project
          path: project

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Force asset import
        run: |
          cd project
          godot --headless --editor --quit 2>&1 || true
          sleep 3

      - name: Start host process (background)
        run: |
          cd project
          nohup godot --headless -- --it03-server --it03-port=38214 \
            > ../host.log 2>&1 &
          echo $! > ../host.pid
          sleep 5
          echo "Host-PID: $(cat ../host.pid)"

      - name: Run client process (foreground, result = exit code)
        id: client
        run: |
          cd project
          set +e
          timeout 180 godot --headless -- --it03-client --it03-connect=127.0.0.1:38214 \
            > ../client.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Stop host process
        if: always()
        run: |
          if [ -f host.pid ]; then
            kill "$(cat host.pid)" 2>/dev/null || true
          fi

      - name: Add logs to job summary
        if: always()
        run: |
          TAIL_BYTES=200000
          {
            echo "## IT-03 Host-Log"
            echo '```'
            { [ -f host.log ] && tail -c "$TAIL_BYTES" host.log; } || echo "(kein Host-Log)"
            echo '```'
            echo "## IT-03 Client-Log"
            echo '```'
            { [ -f client.log ] && tail -c "$TAIL_BYTES" client.log; } || echo "(kein Client-Log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IT-03 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it03-logs
          path: |
            host.log
            client.log
          retention-days: 14
          if-no-files-found: warn

      - name: Evaluate result
        run: |
          CODE="${{ steps.client.outputs.exit_code }}"
          echo "Client-Exit-Code: $CODE"
          if [ "$CODE" != "0" ]; then
            echo "❌ IT-03 fehlgeschlagen (Exit-Code $CODE) — siehe Job-Summary/Logs."
            exit 1
          fi
          echo "✅ IT-03 bestanden."

      # WICHTIG: Muss NACH 'Evaluate result' stehen — if: failure() greift erst,
      # wenn ein vorheriger Schritt des Jobs rot ist (Fix: feuerte davor nie).
      - name: Post failure logs to Issue #5
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## 🩺 IT-03 Failure — Run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "### Host-Log (Tail 150)"
            echo '```'
            { [ -f host.log ] && tail -n 150 host.log; } || echo "(kein Host-Log)"
            echo '```'
            echo "### Client-Log (Tail 150)"
            echo '```'
            { [ -f client.log ] && tail -n 150 client.log; } || echo "(kein Client-Log)"
            echo '```'
          } > /tmp/it03-comment.md
          gh api repos/${{ github.repository }}/issues/5/comments \
            -f body=@/tmp/it03-comment.md \
            && echo "✅ Logs als Kommentar in Issue #5 gepostet."

  # ─── DI-Überblick + Testabdeckung ──────────────────────────────────────────
  di-test-overview:
    name: DI-Überblick & Testabdeckung
    runs-on: ubuntu-22.04
    needs: resolve-source

    steps:
      - name: Download resolved project
        uses: actions/download-artifact@v4
        with:
          name: resolved-project
          path: project

      - name: Run DI/coverage overview
        run: |
          python3 project/scripts/ci/di_test_overview.py \
            --project project \
            --out di-overview.json \
            --markdown-out di-overview.md

      - name: Upload DI overview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: di-test-overview
          path: |
            di-overview.json
            di-overview.md
          retention-days: 14
          if-no-files-found: warn

  # ─── Android Build ───────────────────────────────────────────────────────────
  # GATING (Issue #3): needs um test-logic und integration-two-process erweitert —
  # rote Tests ⇒ kein APK-Artifact. Debug-APKs gibt es damit nur bei grünen
  # Tests; für manuelle Handy-Tests trotz roter Tests ggf. workflow_dispatch mit
  # anschließendem Neustart der fehlgeschlagenen Jobs nutzen.
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    needs: [resolve-source, test-logic, integration-two-process]
    timeout-minutes: 30

    steps:
      - name: Download resolved project
        uses: actions/download-artifact@v4
        with:
          name: resolved-project
          path: project

      - name: Show source info
        run: |
          echo "Projektquelle: ${{ needs.resolve-source.outputs.project_path }}"
          echo "ZIP genutzt:   ${{ needs.resolve-source.outputs.used_zip }}"
          echo "project.godot: $(find project -name 'project.godot' | head -1)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build tools & NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313"

      - name: Configure Godot Android SDK path
        run: |
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
            echo "export/android/debug_keystore = \"${GITHUB_WORKSPACE}/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.tres
          echo "ANDROID_HOME=${ANDROID_HOME}"
          cat ~/.config/godot/editor_settings-4.tres

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable"
          wget -q "${URL}/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Android export templates
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable"
          TPL="Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          wget -q "${URL}/${TPL}" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, O=Android, C=US"

      - name: Ensure export_presets.cfg exists
        run: |
          PRESETS="project/export_presets.cfg"
          if [ ! -f "$PRESETS" ]; then
            echo "❌ Kein export_presets.cfg im Projekt — Host/Guest-Presets müssen im Repo vorliegen (siehe README)." >&2
            exit 1
          else
            echo "export_presets.cfg vorhanden (kommt aus dem Projekt)."
          fi

      # FIX 2026-10-11: Vorher war dieser Schritt doppelt kaputt (immer versionCode=1,
      # Ergebnis wurde nie konsumiert). Jetzt: scripts/ci/bump_version.py schreibt
      # github.run_number als monoton steigenden versionCode direkt in die Presets.
      - name: Bump APK version code (from run number)
        run: |
          python3 project/scripts/ci/bump_version.py \
            --presets project/export_presets.cfg \
            --version-code ${{ github.run_number }}

      - name: Create output directory
        run: mkdir -p project/build/android

      - name: Strip test files and GUT addon
        run: |
          echo "🧹 Entferne Test-Skripte und GUT-Addon für den Produktions-Export..."
          rm -rf project/tests/
          rm -rf project/addons/gut/
          rm -rf project/scripts/testing/
          sed -i '/^IT03Harness=/d' project/project.godot
          echo "✅ Fertig. Verbleibende Addons:"
          ls project/addons/ 2>/dev/null || echo "  (keine weiteren Addons)"

      - name: Import project assets
        run: |
          cd project
          godot --headless --editor --quit 2>&1 || true
          sleep 5

      - name: Export APK (Host)
        run: |
          cd project
          godot --headless \
            --export-debug "Android-Host" \
            "build/android/${{ env.EXPORT_NAME }}-Host-debug.apk" \
            2>&1

      - name: Export APK (Guest)
        run: |
          cd project
          godot --headless \
            --export-debug "Android-Guest" \
            "build/android/${{ env.EXPORT_NAME }}-Guest-debug.apk" \
            2>&1

      - name: Verify APKs
        run: |
          for VARIANT in Host Guest; do
            APK="project/build/android/${{ env.EXPORT_NAME }}-${VARIANT}-debug.apk"
            if [ -f "$APK" ]; then
              SIZE=$(du -sh "$APK" | cut -f1)
              echo "✅ APK erstellt: $APK ($SIZE)"
            else
              echo "❌ APK nicht gefunden: $APK"
              exit 1
            fi
          done

      - name: Upload Host APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildGrove-Host-debug-APK
          path: project/build/android/${{ env.EXPORT_NAME }}-Host-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Guest APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildGrove-Guest-debug-APK
          path: project/build/android/${{ env.EXPORT_NAME }}-Guest-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload full source as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WildGrove-Full-Source
          path: |
            project/
            !project/.git/
            !project/build/
          retention-days: 7

  # ─── GitHub Release (nur bei Tag-Push) ──────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Host APK
        uses: actions/download-artifact@v4
        with:
          name: WildGrove-Host-debug-APK
          path: ./release

      - name: Download Guest APK
        uses: actions/download-artifact@v4
        with:
          name: WildGrove-Guest-debug-APK
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*.apk
          generate_release_notes: true
          name: "WildGrove ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
