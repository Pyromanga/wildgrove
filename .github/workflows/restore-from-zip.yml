name: Restore project from zip

# Manueller Trigger only — laeuft nicht mehr automatisch bei Push,
# damit versehentliche Synks ausgeschlossen sind. zip/ bleibt als
# Quelle bis auf weiteres liegen.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    name: Merge zip contents into repo root
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge zip contents into repo root
        run: |
          set -euo pipefail

          if [ ! -f "zip/game.zip" ]; then
            echo "zip/game.zip fehlt — nichts zu tun."
            exit 0
          fi

          echo "Entpacke zip/game.zip ..."
          rm -rf _src && mkdir _src
          unzip -q zip/game.zip -d _src

          GODOT_FILE=$(find _src -maxdepth 4 -name project.godot | head -1 || true)
          if [ -z "$GODOT_FILE" ]; then
            echo "Kein project.godot im ZIP gefunden — breche ab, nichts veraendert."
            exit 1
          fi
          SRC=$(dirname "$GODOT_FILE")
          echo "Godot-Projekt im ZIP: $SRC"

          cp -a "$SRC"/. ./

          rm -rf .godot
          rm -rf _src

          echo "--- git status ---"
          git status --porcelain | head -100 || true
          echo "------------------"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "wildgrove-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen nach Merge — kein Commit."
            exit 0
          fi
          git commit -m "restore: Projektstand aus zip/game.zip ins Repo gemerged"
          git push
          echo "Restore-Commit gepusht."
