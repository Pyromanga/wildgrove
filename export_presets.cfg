[preset.0]

; Host+Guest statt einem einzelnen "Android"-Preset: IT-03 (Zwei-Prozess-
; Movement-Test, siehe .github/workflows/build-apk.yml Job "build-android")
; installiert zwei APKs nebeneinander auf demselben Gerät/Emulator. Android
; unterscheidet Apps ausschließlich über package/unique_name (applicationId)
; — mit nur einem Preset/einer applicationId würde die zweite Installation
; die erste überschreiben statt daneben zu existieren.
name="Android-Host"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/WildGrove-Host-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug="../../debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release=""
keystore/release_user=""
keystore/release_password=""
package/unique_name="com.yourname.wildgrove.host"
package/name="WildGrove Host"
package/signed=true
package/classify_as_game=true
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_app_library=true
package/enable_backup=true
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/orientation=6
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
screen/min_sdk=24
screen/target_sdk=34
version/code=1
version/name="0.1.0"
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
