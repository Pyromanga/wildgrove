[preset.2]

; ADR-010 Round 55 — Tier 3 (Dedizierter Server).
; dedicated_server=true: Godots eingebauter Server-Build-Modus — kein
; Rendering-/Audio-Treiber-Code im Binary (nicht nur "--headless" zur
; Laufzeit auf einem regulären Build). Aktiviert Tier 3 nur zusammen mit dem
; Cmdline-User-Arg "--dedicated-server" (siehe DedicatedServerBootstrap.gd) —
; ohne das Argument bootet auch dieses Binary regulär bis zum MainMenu und
; wartet dort (kein Sinn ohne Eingabe/Rendering, aber kein Absturz).
name="Linux Dedicated Server"
platform="Linux/X11"
runnable=true
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/linux-server/WildGrove-server.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
apk_expansion/public_key=""
permissions/access_network_state=false
permissions/internet=false
permissions/vibrate=true
